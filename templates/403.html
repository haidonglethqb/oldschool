{% extends "base.html" %}
{% block title %}403 — Từ chối truy cập | Old School{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-7 col-lg-5">
    <div class="os-card p-4 text-center">
      <div class="display-4 text-danger mb-3"><i class="bi bi-shield-lock-fill"></i></div>
      <h4 class="fw-bold mb-2">Từ chối quyền truy cập (403)</h4>
      <p class="text-muted mb-4">
        {{ error_message|default:"Bạn không có quyền truy cập vào chức năng hoặc dữ liệu của cơ sở này." }}
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{% url 'catalog:product_list' %}" class="btn btn-os-primary">
          <i class="bi bi-arrow-left me-1"></i>Quay về Danh mục hàng hóa
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
