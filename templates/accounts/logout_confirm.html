{% extends "base.html" %}
{% block title %}Xác nhận đăng xuất | Old School{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-6 col-lg-4">
    <div class="os-card p-4 text-center">
      <div class="display-5 text-warning mb-3"><i class="bi bi-question-circle-fill"></i></div>
      <h5 class="fw-bold mb-2">Bạn có chắc chắn muốn đăng xuất không?</h5>
      <p class="text-muted small mb-4">
        Phiên làm việc hiện tại của <strong>{{ request.user.display_name }}</strong> sẽ kết thúc an toàn.
      </p>
      <form method="post" class="d-flex justify-content-center gap-2">
        {% csrf_token %}
        <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary px-4">Không</a>
        <button type="submit" class="btn btn-danger px-4">
          <i class="bi bi-box-arrow-right me-1"></i>Có
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
